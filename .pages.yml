media:
  input: public/uploads
  output: /uploads
  rename: safe
  categories: [image]
content:
  - name: nekretnine
    label: Nekretnine
    type: collection
    path: content/nekretnine
    format: json
    filename: "{primary}.json"
    view:
      primary: naslov
      fields: [naslov, lokacija, cijena, objavljeno]
      sort: naslov
    fields:
      - name: naslov
        label: Naslov oglasa
        type: string
        required: true
      - name: objavljeno
        label: Objavljeno na stranici
        type: boolean
        description: Isključite za skrivanje oglasa. Spremanje promjene automatski pokreće novu objavu stranice.
      - name: primjer
        label: Demonstracijski oglas
        type: boolean
        description: Isključiti za stvarnu nekretninu.
      - name: namjena
        label: Ponuda
        type: select
        required: true
        options:
          values:
            - name: prodaja
              label: Prodaja
            - name: najam
              label: Najam
      - name: vrsta
        label: Vrsta nekretnine
        type: select
        required: true
        options:
          values:
            - name: stan
              label: Stan
            - name: kuca
              label: Kuća
            - name: zemljiste
              label: Zemljište
            - name: poslovni
              label: Poslovni prostor
      - name: lokacija
        label: Lokacija
        type: string
        required: true
      - name: adresa
        label: Adresa (neobavezno)
        type: string
        description: Unesite samo ako smije biti javno prikazana.
      - name: cijena
        label: Cijena u eurima
        type: number
        required: true
      - name: povrsina
        label: Površina u m²
        type: number
        required: true
      - name: sobe
        label: Broj soba
        type: number
      - name: naslovna
        label: Naslovna fotografija
        type: image
        required: true
        description: Prikazuje se na kartici i kao prva fotografija oglasa.
      - name: galerija
        label: Ostale fotografije
        type: image
        options:
          multiple:
            max: 24
          unique: true
      - name: opis
        label: Opis
        type: text
        required: true
      - name: karakteristike
        label: Karakteristike
        type: select
        options:
          multiple: true
          values: [Balkon, Terasa, Parkirno mjesto, Garaža, Lift, Vrt, Novogradnja, Pogled, Spremište, Klima]
      - name: kontakt_ime
        label: Kontakt osoba
        type: string
      - name: kontakt_telefon
        label: Kontakt telefon
        type: string
      - name: kontakt_email
        label: Kontakt e-pošta
        type: string
